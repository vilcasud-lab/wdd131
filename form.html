<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="description" content="Product review form page.">
    <meta name="author" content="Alex Gilbert Vilca Fernandez">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <!-- Para JS -->
            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Radio Buttons -->
            <fieldset>
                <legend>Overall Rating</legend>
                <div class="rating">
                    <label><input type="radio" id="rating1" name="rating" value="1" required> ☆</label>
                    <label><input type="radio" id="rating2" name="rating" value="2" required> ☆☆</label>
                    <label><input type="radio" id="rating3" name="rating" value="3" required> ☆☆☆</label>
                    <label><input type="radio" id="rating4" name="rating" value="4" required> ☆☆☆☆</label>
                    <label><input type="radio" id="rating5" name="rating" value="5" required> ☆☆☆☆☆</label>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- Checkboxes -->
            <fieldset>
                <legend>Which features did you find useful in the product? <em>(Check all that apply)</em></legend>
                <label><input type="checkbox" id="feature1" name="features" value="durability"> Durability</label>
                <label><input type="checkbox" id="feature2" name="features" value="easeOfUse"> Ease of Use</label>
                <label><input type="checkbox" id="feature3" name="features" value="performance"> Performance</label>
                <label><input type="checkbox" id="feature4" name="features" value="design"> Design</label>
            </fieldset>

            <!--  Written Review -->
            <label for="review">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="review" name="review" rows="4"></textarea>

            <!-- Your Name -->
            <label for="userName">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="userName" name="userName">

            <!-- Envío -->
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Alex Gilbert Vilca Fernandez - Peru</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
