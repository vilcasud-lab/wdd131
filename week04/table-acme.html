<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Feature Comparison</title>
    <link rel="stylesheet" href="styles/table-acme.css">
</head>
<body>
    <table>
        <caption>Table 1: Account Feature Comparison</caption>
        <thead>
            <tr>
                <th colspan="4" scope="colgroup" class="main-header">ACME Wildwest Services</th>
            </tr>
            <tr>
                <th scope="col" class="empty-header"></th>
                <th scope="col" class="sub-header">Basic</th>
                <th scope="col" class="sub-header">Premium</th>
                <th scope="col" class="sub-header">Deluxe</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Feature 1</th>
                <td class="icon">✔</td>
                <td class="icon">✔</td>
                <td class="icon">✔</td>
            </tr>
            <tr>
                <th scope="row">Feature 2</th>
                <td class="icon">❌</td>
                <td class="icon">✔</td>
                <td class="icon">✔</td>
            </tr>
            <tr>
                <th scope="row">Feature 3</th>
                <td class="icon">❌</td>
                <td class="icon">❌</td>
                <td class="icon">✔</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
