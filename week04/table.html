<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/table.css">
</head>

<body>
    <table>
        <caption>Estadísticas de Producción de Kéfir (Semanales)</caption>
        <thead>
            <tr>
                <th scope="col">Tipo de Kéfir</th>
                <th scope="col">Temperatura (°C)</th>
                <th scope="col">Tiempo (Horas)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Kéfir de Leche</td>
                <td>20 - 24</td>
                <td>24</td>
            </tr>
            <tr>
                <td>Búlgaros de Agua</td>
                <td>22 - 26</td>
                <td>48</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Promedio de Fermentación</td>
                <td>36 hrs</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
